[package]
name = "noteit-core"
version = "0.1.0"
edition = "2021"
authors = ["Note-it contributors"]
license = "MIT"
description = "Headless domain and persistence core for Note-it"
repository = "https://github.com/TheGhols/Note-it"
publish = false

[features]
test-support = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
