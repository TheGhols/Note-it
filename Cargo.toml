[package]
name = "note-it"
version = "0.1.0"
edition = "2021"
authors = ["Note-it contributors"]
license = "MIT"
description = "A minimalist sticky note application for Linux Wayland"
repository = "https://github.com/TheGhols/Note-it"
readme = "README.md"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_16"] }
gtk4-layer-shell = "0.8"
webkit6 = "0.6"
glib = "0.22"
gio = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
