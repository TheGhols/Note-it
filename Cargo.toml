[workspace]
members = [
    "noteit-core",
    "noteit-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# The writer lease is `std::fs::File::try_lock`, stabilised in 1.89. Stating it
# here turns "your toolchain is too old" into a clear message from Cargo rather
# than a wall of errors about a method that does not exist — and it is the
# reason this phase needed no locking dependency at all.
rust-version = "1.89"
authors = ["Note-it contributors"]
license = "MIT"
repository = "https://github.com/TheGhols/Note-it"

[package]
name = "note-it"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A minimalist sticky note application for Linux Wayland"
readme = "README.md"

[dependencies]
noteit-core = { path = "noteit-core" }
gtk4 = { version = "0.11", features = ["v4_16"] }
gtk4-layer-shell = "0.8"
webkit6 = "0.6"
glib = "0.22"
gio = "0.22"
# Re-exported by `glib` and used for the same main loop it drives: the control
# socket is read on worker threads and every request is handed to the GTK main
# context, which is the only place the store and the windows may be touched.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
noteit-core = { path = "noteit-core", features = ["test-support"] }
tempfile = "3.10"
