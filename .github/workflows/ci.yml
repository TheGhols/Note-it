name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every step below runs a stage of `scripts/check`, which is where the gates
# actually live. The workflow decides *what runs where* and keeps one step per
# gate so a red run names the gate that failed; it does not restate the
# commands. Installing the runner's system packages stays here, because that
# is the runner's business and not the repository's.
#
# The list of steps is not maintained by hand against that script: the first
# gate below is `ci-parity`, which fails the build if any stage of
# `scripts/check` has no step here. It exists because the drift already
# happened once.
#
# `gcc` is named explicitly rather than left to arrive as somebody's transitive
# dependency: since 4.3C.R1 the artifact is verified with `ring`, whose build
# compiles BoringSSL's assembly, so a C toolchain is a stated requirement of
# this build and not an accident of the image.
jobs:
  rust-check:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install System Dependencies & Rust Toolchain
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm git pkgconf gcc gtk4 gtk4-layer-shell webkitgtk-6.0 rust dbus python-gobject

      - uses: actions/checkout@v4

      - name: Environment Diagnosis
        run: scripts/doctor rust

      - name: Gate Parity With scripts/check
        run: scripts/check ci-parity

      - name: Rust Format Check
        run: scripts/check rust-format

      - name: Cargo Check
        run: scripts/check rust-check

      - name: Clippy Lint
        run: scripts/check rust-clippy

      - name: Core Dependency Boundary
        run: scripts/check core-boundary

      - name: CLI Dependency Boundary
        run: scripts/check cli-boundary

      - name: MCP Dependency Boundary
        run: scripts/check mcp-boundary

      - name: Embedding Dependency Boundary
        run: scripts/check embedding-boundary

      - name: Headless Core Tests
        run: scripts/check core-tests

      - name: Headless CLI Tests
        run: scripts/check cli-tests

      - name: Headless MCP Tests
        run: scripts/check mcp-tests

      - name: Headless Embedding Tests
        run: scripts/check embedding-tests

      - name: Run Rust Unit Tests
        run: scripts/check workspace-tests

  frontend-check:
    name: Frontend Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment Diagnosis
        run: scripts/doctor frontend

      - name: Install Frontend Dependencies
        run: scripts/check frontend-install

      - name: TypeScript Lint
        run: scripts/check frontend-lint

      - name: Run Frontend Tests
        run: scripts/check frontend-test

      - name: Build Frontend Bundle
        run: scripts/check frontend-build
