<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' note-it-asset:;">
  <title>Note-it</title>
</head>
<body>
  <div id="app">
    <!-- Overlaid chrome. It carries no drawing of its own: the six quick-action
         spans are filled in at build time from the reviewed icon files, so the
         icons ship as inline SVG and there is exactly one copy of each. -->
    <div id="drag-handle" class="note-header">
      <div id="note-controls-left" class="note-controls-left">
        <button id="btn-menu" class="icon-btn" title="Configurações da nota" aria-label="Configurações da nota">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <line x1="1.5" y1="3" x2="10.5" y2="3"></line>
            <line x1="1.5" y1="6" x2="10.5" y2="6"></line>
            <line x1="1.5" y1="9" x2="10.5" y2="9"></line>
          </svg>
        </button>
        <button id="btn-note-color" class="icon-btn header-quick-action" title="Cor da nota" aria-label="Cor da nota">
          <span class="header-action-icon" data-quick-icon="note-color"></span>
        </button>
        <button id="btn-text-size" class="icon-btn header-quick-action" title="Tamanho do texto" aria-label="Tamanho do texto">
          <span class="header-action-icon" data-quick-icon="text-size"></span>
        </button>
        <button id="btn-text-color" class="icon-btn header-quick-action" title="Cor do texto" aria-label="Cor do texto">
          <span class="header-action-icon" data-quick-icon="text-color"></span>
        </button>
        <button id="btn-highlight" class="icon-btn header-quick-action" title="Marca-texto" aria-label="Marca-texto">
          <span class="header-action-icon" data-quick-icon="highlight"></span>
        </button>
        <button id="btn-blocks" class="icon-btn header-quick-action" title="Blocos" aria-label="Blocos">
          <span class="header-action-icon" data-quick-icon="blocks"></span>
        </button>
        <button id="btn-search" class="icon-btn header-quick-action" title="Buscar" aria-label="Buscar">
          <span class="header-action-icon" data-quick-icon="search"></span>
        </button>
        <!-- The one button in this bar that does something rather than opening
             something: one click and the file chooser is up. Putting a picture
             in a note is the commonest thing anyone does with the Mídia
             section, and a panel to pass through on the way would be a second
             click for nothing to read. That menu entry stays exactly where it
             is — this is a second way in, which is the rule the six beside it
             already follow. -->
        <button id="btn-insert-image" class="icon-btn header-quick-action" title="Inserir imagem" aria-label="Inserir imagem">
          <span class="header-action-icon" data-quick-icon="insert-image"></span>
        </button>
        <!-- The timer is not one of the six quick actions: it opens a panel of
             its own rather than a section of the note menu, and it is the one
             control that stays on a collapsed note, because a countdown you
             cannot see is a countdown you have to expand a note to trust. Its
             drawing is written out here like the hamburger and the close
             cross, the page's other two hand-drawn marks, rather than being
             one of the supplied icon files the build writes in. -->
        <button id="btn-timer" class="icon-btn header-timer-action" title="Timer e Pomodoro" aria-label="Timer e Pomodoro">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="6.9" r="4.2"></circle>
            <path d="M6 4.7v2.2h1.7"></path>
            <path d="M4.5 1.1h3"></path>
          </svg>
          <span id="note-timer-readout" class="header-timer-readout" hidden></span>
        </button>
        <!-- The AutoPaste indicator. Unlike every other control in this bar it
             is absent unless the note is the one capturing the clipboard: the
             bar has no room for another permanent button, and a mode that
             watches what you copy should announce itself by appearing rather
             than by a tint on something that was always there. It is also a
             way back to the panel that switches it off, which is the first
             thing anyone who notices it may want. -->
        <button id="btn-autopaste" class="icon-btn header-autopaste" title="AutoPaste ativo" aria-label="AutoPaste ativo. Abrir Captura" aria-pressed="true" hidden>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.6" y="2.6" width="6.8" height="8.2" rx="1.1"></rect>
            <path d="M4.6 2.6V1.7h2.8v0.9"></path>
            <path d="M4.9 6.1h2.2"></path>
            <path d="M4.9 8.3h2.2"></path>
          </svg>
        </button>
      </div>
      <div class="drag-region">
        <span id="note-title" class="note-title">Nota sem título</span>
      </div>
      <div class="note-controls-right">
        <button id="btn-close" class="icon-btn" title="Fechar (Ctrl+W)" aria-label="Fechar nota">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="1" y1="1" x2="11" y2="11"></line>
            <line x1="11" y1="1" x2="1" y2="11"></line>
          </svg>
        </button>
      </div>
    </div>
    <div id="editor-container" class="editor-wrapper"></div>
    <div id="resize-handle" class="resize-handle" title="Redimensionar" aria-label="Redimensionar"></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
