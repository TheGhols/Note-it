[package]
name = "noteit-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless CLI for Note-it"
publish = false

[[bin]]
name = "noteit"
path = "src/main.rs"

[dependencies]
noteit-core = { path = "../noteit-core" }
clap = { version = "4.5", features = ["derive"] }
# The machine interface is serialised, never assembled. Both are already in the
# workspace's dependency graph through `noteit-core`; stated here because this
# crate now depends on them directly.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# One call: `ioctl(TIOCGWINSZ)`, to ask the terminal how wide it is so the
# presentation can shrink instead of wrapping. The standard library has no
# answer for that, and `COLUMNS` alone is not one — shells do not export it, so
# relying on it would mean the narrow layouts never actually appeared. Already
# in this workspace's graph through `dirs-sys` and `getrandom`, so it adds a
# dependency edge and not a crate. Nothing about it reaches the Core.
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
