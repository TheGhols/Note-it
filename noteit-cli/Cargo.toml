[package]
name = "noteit-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless CLI for Note-it"
publish = false

[[bin]]
name = "noteit"
path = "src/main.rs"

[dependencies]
noteit-core = { path = "../noteit-core" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
