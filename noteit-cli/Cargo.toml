[package]
name = "noteit-cli"
version = "0.1.0"
edition = "2021"
authors = ["Note-it contributors"]
license = "MIT"
description = "Headless CLI for Note-it"
repository = "https://github.com/TheGhols/Note-it"
publish = false

[[bin]]
name = "noteit"
path = "src/main.rs"

[dependencies]
noteit-core = { path = "../noteit-core" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
