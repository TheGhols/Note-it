[package]
name = "noteit-agent-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runs an external AI CLI on behalf of Note-it, and turns its output into events"
publish = false

[lib]
name = "noteit_agent_bridge"
path = "src/lib.rs"

# Deliberately short.
#
# This crate starts a program somebody else installed and reads lines of JSON
# from it. It has no HTTP client, no vendor SDK, no async runtime and no
# dependency on `noteit-core` — the last one on purpose: a component that
# cannot link the store cannot own it, and "never owns the store" stops being a
# rule anybody has to remember.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For the one thing `std::process` cannot do: end a *process group*.
#
# Killing the client alone is not enough. An AI client that itself starts a
# helper — an MCP server, a sub-agent — leaves that helper holding the pipe
# this crate is reading, and the read never ends. The client is therefore put
# in its own process group and the group is what is ended.
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
