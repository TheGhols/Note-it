[package]
name = "noteit-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terminal User Interface for Note-it"
publish = false

[lib]
name = "noteit_tui"
path = "src/lib.rs"

[[bin]]
name = "noteit-tui"
path = "src/main.rs"

[dependencies]
noteit-core = { path = "../noteit-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0" }
signal-hook = "0.3.18"
rustix = { version = "=1.1.4", features = ["termios"] }
# Extended grapheme clusters, for the visual editor's cursor and selection.
#
# Authorised by the 5.0D.4B.2 gate in docs/tui.md §26.12 and audited there: both
# crates are MIT OR Apache-2.0, have zero transitive dependencies of their own,
# state an MSRV below this workspace's 1.89, and contain no network, no I/O and
# no runtime. Both versions were already in Cargo.lock through ratatui and
# crossterm, so naming them here resolves no new crate and changes no version:
# the whole diff to Cargo.lock is two lines adding them to this package's own
# dependency list. It makes the API a declared dependency instead of an accident
# of somebody else's tree.
#
# Writing a segmenter by hand is forbidden (§26.12), and ratatui's own
# `styled_graphemes` is forbidden as the source map's segmenter (§27.17): it
# drops any grapheme containing a control character, TAB included, which would
# silently shift every EGC index after one.
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
libc = "0.2"
tempfile = "3.10"
