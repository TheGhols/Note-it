[package]
name = "noteit-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terminal User Interface for Note-it"
publish = false

[lib]
name = "noteit_tui"
path = "src/lib.rs"

[[bin]]
name = "noteit-tui"
path = "src/main.rs"

[dependencies]
noteit-core = { path = "../noteit-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29.0" }
signal-hook = "0.3.18"

[dev-dependencies]
libc = "0.2"
tempfile = "3.10"
