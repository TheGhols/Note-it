[package]
name = "noteit-embedding-local"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local, offline embedding provider for Note-it's semantic retrieval"
publish = false

[dependencies]
# The contracts, and nothing about them is specific to this implementation.
# The dependency points this way on purpose: the Core defines
# `EmbeddingProvider` and must never learn what runs behind it.
noteit-core = { path = "../noteit-core" }
# The tokenizer, read from a file and never fetched. `default-features = false`
# turns off `onig` (a C regex library), `esaxx_fast` (C++) and the progress
# bar; `fancy-regex` puts a pure-Rust backend in their place. The `http`
# feature — which is what would pull `hf-hub` and `ureq` — is off, and
# `scripts/check-embedding-boundary` fails the build if it ever arrives.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# The weights, as a described byte layout rather than a pickle. Pure Rust, no
# runtime, no network.
# `default-features = false` drops safetensors' `std` feature, whose only effect
# here would be to pull `tempfile` — and with it `rustix` and `fastrand` — into
# the shipped graph of a server that writes no temporary file. The header is
# parsed from a byte slice either way.
safetensors = { version = "0.8", default-features = false, features = ["alloc"] }
# Reading the one field this crate needs out of `tokenizer.json` without
# materialising the other eighteen megabytes of it as a `Value`.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Where the artifact lives, by the same XDG rules the rest of Note-it follows.
dirs = "5.0"
# SHA-256 over 489 MiB, which is the whole cost of loading the artifact and the
# one budget the 4.3C could not meet. The choice was measured and not assumed:
# on this machine (no SHA-NI), over the real artifact, best of three in
# release, every implementation producing the identical digest —
#
#     noteit-core, as written        197–201 MiB/s
#     sha2 0.10 (RustCrypto)         174–178 MiB/s
#     sha2-asm 0.6                   187–189 MiB/s
#     ring 0.17                      324–326 MiB/s
#
# The pure-Rust crates are *slower* than the Core's own; `ring` is the only
# maintained implementation that is faster, because it carries BoringSSL's
# AVX2 assembly. It is used here and nowhere else: `NoteRevision` and every
# other digest in the product stay on `noteit_core::hashing`, which this crate
# keeps agreeing with byte for byte — see `tests/digest_agreement.rs`.
#
# It brings no network. `ring` is a primitives library, its graph is four
# crates (`cfg-if`, `getrandom`, `libc`, `untrusted`), and
# `scripts/check-embedding-boundary` still refuses every HTTP, TLS and socket
# crate at any depth.
ring = "0.17"

[dev-dependencies]
tempfile = "3.10"
